name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -d "quran-call-app" ]; then cd quran-call-app; fi
          npm install --legacy-peer-deps

      - name: Build Web App
        env:
          VITE_PUBLIC_APP_URL: https://quranc1.lovable.app
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-key
        run: |
          if [ -d "quran-call-app" ]; then cd quran-call-app; fi
          npm run build

      - name: Sync Capacitor Android
        run: |
          if [ -d "quran-call-app" ]; then cd quran-call-app; fi
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          if [ -d "quran-call-app" ]; then cd quran-call-app/android; else cd android; fi
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          if [ -d "quran-call-app" ]; then cd quran-call-app/android; else cd android; fi
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            quran-call-app/android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
