name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto Detect Directory & Install
        run: |
          if [ -f "package.json" ]; then
            echo "ROOT_DIR=." >> $GITHUB_ENV
          else
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \;)
            echo "ROOT_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: |
          cd ${{ env.ROOT_DIR }}
          npm install --legacy-peer-deps

      - name: Build Web App
        env:
          VITE_PUBLIC_APP_URL: https://quranc1.lovable.app
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-key
          NODE_ENV: production
        run: |
          cd ${{ env.ROOT_DIR }}
          npx vite build --emptyOutDir || npm run build

      - name: Sync Capacitor Android
        run: |
          cd ${{ env.ROOT_DIR }}
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd ${{ env.ROOT_DIR }}/android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd ${{ env.ROOT_DIR }}/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.ROOT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
